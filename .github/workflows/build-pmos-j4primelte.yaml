name: Repack artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Eski workflow run ID"
        required: true
        default: "31159895880"
      artifact_name:
        description: "Artifact adı"
        required: true
        default: "pmos-samsung-j4primelte-phosh-run4"

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download old artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Check files
        run: |
          echo "Files:"
          ls -lah artifact
          echo "Symlinks:"
          find artifact -type l -ls || true

      - name: Create tar.xz
        run: |
          tar --dereference -cJf pmos-j4primelte.tar.xz -C artifact .

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: pmos-j4primelte-compressed
          path: pmos-j4primelte.tar.xz
