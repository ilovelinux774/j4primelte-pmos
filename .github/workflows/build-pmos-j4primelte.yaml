name: Build postmarketOS – j4primelte

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui:
        description: "UI"
        required: false
        default: "weston"
        type: choice
        options:
          - weston
          - xfce4
          - fbkeyboard
          - phosh
          - plasma-mobile
          - console
      channel:
        description: "Channel"
        required: false
        default: "edge"
        type: choice
        options:
          - edge
          - v24.12
      extra_packages:
        description: "Extra packages"
        required: false
        default: "none"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE:         "samsung-j4primelte"
  UI:             ${{ github.event.inputs.ui             || 'weston' }}
  CHANNEL:        ${{ github.event.inputs.channel        || 'edge'   }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || 'none'   }}
  PMB_WORK:       "/home/runner/.local/var/pmbootstrap"
  PMB_APORTS:     "/home/runner/pmaports"
  EXPORT_DIR:     "/tmp/postmarketOS-export"
  PMB_SUDO:       "sudo"
  J4_FORK_URL:    "https://github.com/postmarketos-j4primelte/pmaports-j4primelte.git"
  UPSTREAM_URL:   "https://gitlab.postmarketos.org/postmarketOS/pmaports.git"

jobs:
  build:
    name: "[${{ github.event.inputs.ui || 'weston' }}] j4primelte"
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get autopurge -y "dotnet-*" "aspnetcore-*" "mono-*" \
            google-chrome-stable microsoft-edge-stable firefox 2>/dev/null || true
          sudo apt-get clean
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-pip openssl coreutils procps sudo \
            qemu-user-static binfmt-support ccache xz-utils kpartx
          sudo systemctl restart binfmt-support || true

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            /tmp/pmbootstrap-src
          pip install --break-system-packages /tmp/pmbootstrap-src || \
            pip install /tmp/pmbootstrap-src
          pmbootstrap --version

      - name: Cache HTTP
        uses: actions/cache@v4
        with:
          path: ${{ env.PMB_WORK }}/cache_http
          key: pmb-http-${{ env.DEVICE }}-${{ env.CHANNEL }}-${{ hashFiles('aports/**') }}
          restore-keys: |
            pmb-http-${{ env.DEVICE }}-${{ env.CHANNEL }}-
            pmb-http-${{ env.DEVICE }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PMB_WORK }}/cache_ccache_aarch64
            ${{ env.PMB_WORK }}/cache_ccache_armv7
            ${{ env.PMB_WORK }}/cache_ccache_x86_64
          key: ccache-${{ env.DEVICE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-

      - name: Clone pmaports + overlay j4primelte
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "edge" ]; then PMAPORTS_BRANCH="main"; else PMAPORTS_BRANCH="$CHANNEL"; fi

          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

          for i in 1 2 3; do
            echo "▶ pmaports clone denemesi $i/3..."
            git clone \
              --depth=1 \
              --no-single-branch \
              --branch "$PMAPORTS_BRANCH" \
              "$UPSTREAM_URL" \
              "$PMB_APORTS" && break || {
              echo "⚠️ Clone başarısız, 10 saniye bekleniyor..."
              rm -rf "$PMB_APORTS"
              sleep 10
            }
          done

          [ -d "$PMB_APORTS" ] || { echo "::error::pmaports clone başarısız!"; exit 1; }

          echo "▶ Branch : $(git -C "$PMB_APORTS" rev-parse --abbrev-ref HEAD)"
          echo "▶ Commit : $(git -C "$PMB_APORTS" rev-parse --short HEAD)"
          git -C "$PMB_APORTS" show "origin/${PMAPORTS_BRANCH}:channels.cfg" | head -5

          for i in 1 2 3; do
            echo "▶ j4primelte fork clone denemesi $i/3..."
            git clone --depth=1 "$J4_FORK_URL" /tmp/pmaports-j4primelte && break || {
              echo "⚠️ Fork clone başarısız, 10 saniye bekleniyor..."
              rm -rf /tmp/pmaports-j4primelte
              sleep 10
            }
          done

          [ -d /tmp/pmaports-j4primelte ] || { echo "::error::Fork clone başarısız!"; exit 1; }

          J4_PKGS=$(find /tmp/pmaports-j4primelte \
            \( -name "device-samsung-j4primelte" \
            -o -name "linux-samsung-j4primelte" \
            -o -name "firmware-samsung-j4primelte" \) \
            -type d 2>/dev/null || true)

          if [ -z "$J4_PKGS" ]; then
            echo "::error::Fork'ta j4primelte paketleri bulunamadı!"
            exit 1
          fi

          for PKG_DIR in $J4_PKGS; do
            PKG_NAME=$(basename "$PKG_DIR")
            cp -r "$PKG_DIR" "$PMB_APORTS/device/testing/$PKG_NAME"
          done

          rm -rf /tmp/pmaports-j4primelte
          echo "✅ Overlay tamamlandı"

      - name: Patch device APKBUILD mesa
        shell: bash
        run: |
          set -euo pipefail
          APKBUILD="$PMB_APORTS/device/testing/device-samsung-j4primelte/APKBUILD"
          sed -i 's/mesa-dri-swrast/mesa/g' "$APKBUILD"
          sed -i 's/mesa-swrast/mesa/g' "$APKBUILD"
          grep "depends" "$APKBUILD" || true

      - name: Patch deviceinfo (qcdt + heimdall partitions)
        shell: bash
        run: |
          set -euo pipefail
          DEVICEINFO="$PMB_APORTS/device/testing/device-samsung-j4primelte/deviceinfo"

          sed -i 's/deviceinfo_bootimg_qcdt="false"/deviceinfo_bootimg_qcdt="true"/' "$DEVICEINFO"

          if grep -q "deviceinfo_flash_heimdall_partition_kernel" "$DEVICEINFO"; then
            sed -i 's/deviceinfo_flash_heimdall_partition_kernel=.*/deviceinfo_flash_heimdall_partition_kernel="KERNEL"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_flash_heimdall_partition_kernel="KERNEL"' >> "$DEVICEINFO"
          fi

          if grep -q "deviceinfo_flash_heimdall_partition_rootfs" "$DEVICEINFO"; then
            sed -i 's/deviceinfo_flash_heimdall_partition_rootfs=.*/deviceinfo_flash_heimdall_partition_rootfs="SYSTEM"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_flash_heimdall_partition_rootfs="SYSTEM"' >> "$DEVICEINFO"
          fi

          echo "▶ Güncel deviceinfo:"
          grep -E "qcdt|heimdall|flash" "$DEVICEINFO" || true

      # ──────────────────────────────────────────────────────────────
      #  KRİTİK FIX v2:
      #  1) dtbTool'e SADECE j4primelte DTB'ler ver
      #     (33 DTB → 6 DTB, bootloader doğru match edebilsin)
      #  2) Python → Bash (awk + head/tail)
      #     (package() patch'i çalışmıyordu)
      # ──────────────────────────────────────────────────────────────
      - name: Patch linux APKBUILD (dtbTool + dt.img)
        shell: bash
        run: |
          set -euo pipefail
          APKBUILD="$PMB_APORTS/device/testing/linux-samsung-j4primelte/APKBUILD"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PATCH: linux-samsung-j4primelte APKBUILD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ── 1) makedepends: dtbtool ekle ──────────────
          if ! grep -q "dtbtool" "$APKBUILD"; then
            sed -i '/^makedepends=/s/"$/ dtbtool"/' "$APKBUILD"
            echo "✅ dtbtool makedepends'e eklendi"
          else
            echo "ℹ️  dtbtool zaten makedepends'te"
          fi

          # ── 2) build(): dtbTool ekle (yoksa) ──────────
          #    SADECE j4primelte DTB'ler! (msm8917-samsung-j4primelte-*.dtb)
          if ! grep -q "dtbTool" "$APKBUILD"; then
            echo "▶ dtbTool build()'e ekleniyor..."

            # build() kapanış } satırını bul
            LINE=$(awk '/^build\(\)/{f=1} f && /^}$/{print NR; exit}' "$APKBUILD")

            if [ -z "$LINE" ]; then
              echo "::warning::build() kapanış } bulunamadı"
            else
              # Eklenecek satırları temp dosyaya yaz (tab-indent)
              printf '\t# QCDT: Qualcomm Concatenated Device Tree\n'     >  /tmp/build_insert.txt
              printf '\t# SADECE j4primelte DTB — diger DTBler bootloaderi crash ediyor\n' >> /tmp/build_insert.txt
              printf '\tDTB_DIR=""\n'                                      >> /tmp/build_insert.txt
              printf '\tfor d in arch/arm/boot/dts/qcom arch/arm/boot/dts/samsung arch/arm64/boot/dts/qcom arch/arm64/boot/dts; do\n' >> /tmp/build_insert.txt
              printf '\t\tif [ -d "$builddir/$d" ]; then DTB_DIR="$builddir/$d"; break; fi\n' >> /tmp/build_insert.txt
              printf '\tdone\n'                                            >> /tmp/build_insert.txt
              printf '\t[ -z "$DTB_DIR" ] && { echo "HATA: DTB dizini bulunamadi!"; exit 1; }\n' >> /tmp/build_insert.txt
              printf '\techo "▶ DTB dizini: $DTB_DIR"\n'                  >> /tmp/build_insert.txt
              printf '\t# Sadece j4primelte DTBleri filtrele\n'           >> /tmp/build_insert.txt
              printf '\tJ4_DTBS=$(find "$DTB_DIR" -name "msm8917-samsung-j4primelte-*.dtb" | sort)\n' >> /tmp/build_insert.txt
              printf '\tif [ -z "$J4_DTBS" ]; then\n'                     >> /tmp/build_insert.txt
              printf '\t\techo "HATA: j4primelte DTB bulunamadi!"; exit 1\n' >> /tmp/build_insert.txt
              printf '\tfi\n'                                             >> /tmp/build_insert.txt
              printf '\techo "▶ j4primelte DTB sayisi: $(echo "$J4_DTBS" | wc -l)"\n' >> /tmp/build_insert.txt
              printf '\techo "$J4_DTBS"\n'                                >> /tmp/build_insert.txt
              printf '\t# Gecici dizine sadece j4primelte DTBleri kopyala\n' >> /tmp/build_insert.txt
              printf '\tJ4_DTB_TMP=$(mktemp -d)\n'                       >> /tmp/build_insert.txt
              printf '\tcp $J4_DTBS "$J4_DTB_TMP/"\n'                    >> /tmp/build_insert.txt
              printf '\tdtbTool -s 2048 -o "$builddir/dt.img" "$J4_DTB_TMP"\n' >> /tmp/build_insert.txt
              printf '\trm -rf "$J4_DTB_TMP"\n'                           >> /tmp/build_insert.txt
              printf '\techo "✅ dt.img olusturuldu (sadece j4primelte DTB)"\n' >> /tmp/build_insert.txt

              # Kapanış } önüne ekle
              head -n $((LINE-1)) "$APKBUILD" > "${APKBUILD}.tmp"
              cat /tmp/build_insert.txt    >> "${APKBUILD}.tmp"
              tail -n +$LINE "$APKBUILD"   >> "${APKBUILD}.tmp"
              mv "${APKBUILD}.tmp" "$APKBUILD"

              echo "✅ dtbTool build() fonksiyonuna eklendi (satır $LINE önü)"
            fi
          else
            echo "ℹ️  dtbTool zaten mevcut, atlanıyor"
          fi

          # ── 3) package(): dt.img install ekle (yoksa) ─
          if ! grep -q '/boot/dt\.img' "$APKBUILD"; then
            echo "▶ dt.img install package()'e ekleniyor..."

            # package() kapanış } satırını bul
            LINE=$(awk '/^package\(\)/{f=1} f && /^}$/{print NR; exit}' "$APKBUILD")

            if [ -z "$LINE" ]; then
              echo "::error::package() kapanış } bulunamadı!"
              exit 1
            else
              # Eklenecek satırları temp dosyaya yaz (tab-indent)
              printf '\t# Install QCDT dt.img — ZORUNLU\n'                >  /tmp/pkg_insert.txt
              printf '\tfor _dtimg in arch/arm64/boot/dt.img arch/arm/boot/dt.img dt.img; do\n' >> /tmp/pkg_insert.txt
              printf '\t\tif [ -f "$_dtimg" ]; then\n'                    >> /tmp/pkg_insert.txt
              printf '\t\t\tinstall -Dm644 "$_dtimg" "$pkgdir/boot/dt.img"\n' >> /tmp/pkg_insert.txt
              printf '\t\t\techo "✅ dt.img install edildi: $_dtimg"\n'   >> /tmp/pkg_insert.txt
              printf '\t\t\tbreak\n'                                      >> /tmp/pkg_insert.txt
              printf '\t\tfi\n'                                           >> /tmp/pkg_insert.txt
              printf '\tdone\n'                                           >> /tmp/pkg_insert.txt
              printf '\tif ! [ -f "$pkgdir/boot/dt.img" ]; then\n'        >> /tmp/pkg_insert.txt
              printf '\t\techo "HATA: dt.img bulunamadi!"\n'              >> /tmp/pkg_insert.txt
              printf '\t\texit 1\n'                                       >> /tmp/pkg_insert.txt
              printf '\tfi\n'                                             >> /tmp/pkg_insert.txt

              # Kapanış } önüne ekle
              head -n $((LINE-1)) "$APKBUILD" > "${APKBUILD}.tmp"
              cat /tmp/pkg_insert.txt     >> "${APKBUILD}.tmp"
              tail -n +$LINE "$APKBUILD"  >> "${APKBUILD}.tmp"
              mv "${APKBUILD}.tmp" "$APKBUILD"

              echo "✅ dt.img install package() fonksiyonuna eklendi (satır $LINE önü)"
            fi
          else
            echo "ℹ️  dt.img install zaten mevcut, atlanıyor"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  PATCH TAMAMLANDI"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ──────────────────────────────────────────────────────────────
      #  DOĞRULAMA: Patch'lerin gerçekten uygulandığını kontrol et
      # ──────────────────────────────────────────────────────────────
      - name: Verify APKBUILD patches
        shell: bash
        run: |
          set -euo pipefail
          APKBUILD="$PMB_APORTS/device/testing/linux-samsung-j4primelte/APKBUILD"

          echo "=== makedepends ==="
          grep "makedepends" "$APKBUILD" || true

          echo ""
          echo "=== build() fonksiyonu (son 25 satır) ==="
          awk '/^build\(\)/,/^}$/' "$APKBUILD" | tail -25

          echo ""
          echo "=== package() fonksiyonu (tam) ==="
          awk '/^package\(\)/,/^}$/' "$APKBUILD"

          echo ""
          echo "=== dtbTool / dt.img referansları ==="
          grep -n -E "dtbtool|dtbTool|dt\.img|msm8917-samsung" "$APKBUILD" || true

          # ── Kritik kontroller ──
          if ! grep -q "dtbTool" "$APKBUILD"; then
            echo "::error::dtbTool build() içinde bulunamadı!"
            exit 1
          fi

          if ! grep -q '/boot/dt\.img' "$APKBUILD"; then
            echo "::error::dt.img install package() içinde bulunamadı!"
            exit 1
          fi

          if ! grep -q 'msm8917-samsung-j4primelte' "$APKBUILD"; then
            echo "::error::j4primelte DTB filtresi bulunamadı — tüm DTBler ekleniyor!"
            exit 1
          fi

          echo ""
          echo "✅ Tüm patch'ler doğrulandı (sadece j4primelte DTB)"

      - name: Write config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config"
          EXTRA="${EXTRA_PACKAGES:-none}"
          [ -z "$EXTRA" ] && EXTRA="none"

          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF
          [pmbootstrap]
          aports = ${PMB_APORTS}
          build_default_device_arch = True
          build_pkgs_on_install = True
          ccache_size = 5G
          device = ${DEVICE}
          extra_packages = ${EXTRA}
          hostname = j4primelte
          jobs = $(nproc)
          kernel = downstream
          locale = en_US.UTF-8
          ssh_keys = False
          ssh_key_glob = ~/.ssh/id_*.pub
          sudo_timer = False
          timezone = Europe/Istanbul
          ui = ${UI}
          ui_extras = False
          user = pmos
          work = ${PMB_WORK}
          EOF

      - name: pmbootstrap init
        shell: bash
        run: |
          set +o pipefail
          yes "" | pmbootstrap -y init
          PMB_EXIT="${PIPESTATUS[1]}"
          set -euo pipefail
          if [ "$PMB_EXIT" -ne 0 ] && [ "$PMB_EXIT" -ne 141 ]; then exit "$PMB_EXIT"; fi

          pmbootstrap config device                    "$DEVICE"
          pmbootstrap config ui                        "$UI"
          pmbootstrap config kernel                    "downstream"
          pmbootstrap config build_default_device_arch "True"
          pmbootstrap config build_pkgs_on_install     "True"
          EXTRA="${EXTRA_PACKAGES:-none}"
          [ -z "$EXTRA" ] && EXTRA="none"
          pmbootstrap config extra_packages "$EXTRA"

      - name: Regenerate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$PMB_APORTS/device/testing/device-samsung-j4primelte"
          pmbootstrap checksum device-samsung-j4primelte
          echo "✅ device checksum güncellendi"

          cd "$PMB_APORTS/device/testing/linux-samsung-j4primelte"
          pmbootstrap checksum linux-samsung-j4primelte
          echo "✅ linux checksum güncellendi"

      - name: Verify APKBUILDs exist
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_PKG=$(find "$PMB_APORTS" -path "*/device-${DEVICE}/APKBUILD" -print -quit 2>/dev/null || true)
          KERNEL_PKG=$(find "$PMB_APORTS" -path "*/linux-${DEVICE}/APKBUILD" -print -quit 2>/dev/null || true)
          if [ -z "$DEVICE_PKG" ]; then echo "::error::device APKBUILD yok!"; exit 1; fi
          if [ -z "$KERNEL_PKG" ]; then echo "::error::kernel APKBUILD yok!"; exit 1; fi

      - name: Debug pre-build state
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Linux APKBUILD: build() ==="
          awk '/^build\(\)/,/^}$/' "$PMB_APORTS/device/testing/linux-samsung-j4primelte/APKBUILD" | head -40

          echo ""
          echo "=== Linux APKBUILD: package() ==="
          awk '/^package\(\)/,/^}$/' "$PMB_APORTS/device/testing/linux-samsung-j4primelte/APKBUILD"

          echo ""
          echo "=== deviceinfo (qcdt/flash/dtb) ==="
          grep -E "qcdt|heimdall|flash|dtb" "$PMB_APORTS/device/testing/device-samsung-j4primelte/deviceinfo" || true

          echo ""
          echo "=== pmbootstrap config ==="
          cat "$HOME/.config/pmbootstrap_v3.cfg"

      - name: Build image
        shell: bash
        env:
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
        run: |
          set -euo pipefail
          PASSWORD="${PMOS_PASSWORD:-147147}"
          printf '%s\n%s\n' "$PASSWORD" "$PASSWORD" | pmbootstrap install --no-fde

      - name: Verify dt.img in kernel package
        if: always()
        shell: bash
        run: |
          echo "=== dt.img arama ==="
          find "$PMB_WORK" -name "dt.img" 2>/dev/null | head -10 || true

          echo ""
          echo "=== linux paketi /boot/ ==="
          find "$PMB_WORK" -path "*/linux-samsung-j4primelte*/boot/*" 2>/dev/null | head -20 || true

          echo ""
          echo "=== j4primelte DTB dosyalari ==="
          find "$PMB_WORK" -name "msm8917-samsung-j4primelte-*.dtb" 2>/dev/null | head -10 || true

          echo ""
          echo "=== Tüm qcom DTBler (karsilastirma) ==="
          find "$PMB_WORK" -path "*/dts/qcom/*.dtb" 2>/dev/null | wc -l
          find "$PMB_WORK" -name "msm8917-samsung-j4primelte-*.dtb" 2>/dev/null | wc -l

          if find "$PMB_WORK" -path "*/linux-samsung-j4primelte*/boot/dt.img" -print -quit 2>/dev/null | grep -q .; then
            echo "✅ dt.img kernel paketinde bulundu!"
          else
            echo "⚠️  dt.img kernel paketinde bulunamadı"
          fi

      - name: Upload pmbootstrap log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "pmbootstrap-log-run${{ github.run_number }}"
          path: ${{ env.PMB_WORK }}/log.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          pmbootstrap export "$EXPORT_DIR"
          ls -lah "$EXPORT_DIR"/

      - name: Export Odin
        shell: bash
        run: |
          pmbootstrap export --odin "$EXPORT_DIR" || echo "Odin export başarısız"

      - name: Compress
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference \
            -cJf /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz \
            -C "$EXPORT_DIR" \
            .
          echo "▶ Sonuç:"
          ls -lah /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pmos-${{ env.DEVICE }}-${{ env.UI }}-run${{ github.run_number }}"
          path: /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz
          retention-days: 14
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz
          generate_release_notes: true
          body: |
            ## postmarketOS – j4primelte

            | | |
            |---|---|
            | **UI** | `${{ env.UI }}` |
            | **Channel** | `${{ env.CHANNEL }}` |
            | **Commit** | `${{ github.sha }}` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pmbootstrap -y zap 2>/dev/null || true
          sudo rm -rf "${PMB_WORK}/chroot_"* 2>/dev/null || true
 
