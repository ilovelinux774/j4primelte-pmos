name: Build postmarketOS – j4primelte

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui:
        description: "UI"
        required: false
        default: "weston"
        type: choice
        options:
          - weston
          - xfce4
          - fbkeyboard
          - phosh
          - plasma-mobile
          - console
      channel:
        description: "Channel"
        required: false
        default: "edge"
        type: choice
        options:
          - edge
          - v24.12
      extra_packages:
        description: "Extra packages"
        required: false
        default: "none"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE:         "samsung-j4primelte"
  UI:             ${{ github.event.inputs.ui             || 'weston' }}
  CHANNEL:        ${{ github.event.inputs.channel        || 'edge'   }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages || 'none'   }}
  PMB_WORK:       "/home/runner/.local/var/pmbootstrap"
  PMB_APORTS:     "/home/runner/pmaports"
  EXPORT_DIR:     "/tmp/postmarketOS-export"
  PMB_SUDO:       "sudo"
  J4_FORK_URL:    "https://github.com/postmarketos-j4primelte/pmaports-j4primelte.git"
  UPSTREAM_URL:   "https://gitlab.postmarketos.org/postmarketOS/pmaports.git"

jobs:
  build:
    name: "[${{ github.event.inputs.ui || 'weston' }}] j4primelte"
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get autopurge -y "dotnet-*" "aspnetcore-*" "mono-*" \
            google-chrome-stable microsoft-edge-stable firefox 2>/dev/null || true
          sudo apt-get clean
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-pip openssl coreutils procps sudo \
            qemu-user-static binfmt-support ccache xz-utils kpartx
          sudo systemctl restart binfmt-support || true

      - name: Install pmbootstrap
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap-src
          pip install --break-system-packages /tmp/pmbootstrap-src || pip install /tmp/pmbootstrap-src
          pmbootstrap --version

      - name: Cache HTTP
        uses: actions/cache@v4
        with:
          path: ${{ env.PMB_WORK }}/cache_http
          key: pmb-http-${{ env.DEVICE }}-${{ env.CHANNEL }}-${{ hashFiles('aports/**') }}
          restore-keys: |
            pmb-http-${{ env.DEVICE }}-${{ env.CHANNEL }}-
            pmb-http-${{ env.DEVICE }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PMB_WORK }}/cache_ccache_armv7
            ${{ env.PMB_WORK }}/cache_ccache_x86_64
          key: ccache-${{ env.DEVICE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-

      - name: Clone pmaports + overlay j4primelte
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "edge" ]; then PMAPORTS_BRANCH="main"; else PMAPORTS_BRANCH="$CHANNEL"; fi

          git clone --depth=1 --no-single-branch --branch "$PMAPORTS_BRANCH" "$UPSTREAM_URL" "$PMB_APORTS"
          git -C "$PMB_APORTS" show "origin/${PMAPORTS_BRANCH}:channels.cfg" | head -5

          git clone --depth=1 "$J4_FORK_URL" /tmp/pmaports-j4primelte

          J4_PKGS=$(find /tmp/pmaports-j4primelte \
            \( -name "device-samsung-j4primelte" \
            -o -name "linux-samsung-j4primelte" \
            -o -name "firmware-samsung-j4primelte" \) \
            -type d 2>/dev/null || true)

          if [ -z "$J4_PKGS" ]; then
            echo "::error::Fork'ta j4primelte paketleri bulunamadı!"
            exit 1
          fi

          for PKG_DIR in $J4_PKGS; do
            PKG_NAME=$(basename "$PKG_DIR")
            cp -r "$PKG_DIR" "$PMB_APORTS/device/testing/$PKG_NAME"
          done

          rm -rf /tmp/pmaports-j4primelte

      - name: Patch device APKBUILD mesa
        shell: bash
        run: |
          set -euo pipefail
          APKBUILD="$PMB_APORTS/device/testing/device-samsung-j4primelte/APKBUILD"
          sed -i 's/mesa-dri-swrast/mesa/g' "$APKBUILD"
          sed -i 's/mesa-swrast/mesa/g' "$APKBUILD"
          grep "depends" "$APKBUILD" || true

      - name: Patch deviceinfo (qcdt + heimdall partitions)
        shell: bash
        run: |
          set -euo pipefail
          DEVICEINFO="$PMB_APORTS/device/testing/device-samsung-j4primelte/deviceinfo"

          sed -i 's/deviceinfo_bootimg_qcdt="false"/deviceinfo_bootimg_qcdt="true"/' "$DEVICEINFO"

          if grep -q "deviceinfo_flash_heimdall_partition_kernel" "$DEVICEINFO"; then
            sed -i 's/deviceinfo_flash_heimdall_partition_kernel=.*/deviceinfo_flash_heimdall_partition_kernel="KERNEL"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_flash_heimdall_partition_kernel="KERNEL"' >> "$DEVICEINFO"
          fi

          if grep -q "deviceinfo_flash_heimdall_partition_rootfs" "$DEVICEINFO"; then
            sed -i 's/deviceinfo_flash_heimdall_partition_rootfs=.*/deviceinfo_flash_heimdall_partition_rootfs="SYSTEM"/' "$DEVICEINFO"
          else
            echo 'deviceinfo_flash_heimdall_partition_rootfs="SYSTEM"' >> "$DEVICEINFO"
          fi

          echo "▶ Güncel deviceinfo:"
          grep -E "qcdt|heimdall|flash" "$DEVICEINFO" || true

      - name: Patch linux APKBUILD (dtbTool + dt.img)
        shell: bash
        run: |
          set -euo pipefail
          LINUX_APKBUILD="$PMB_APORTS/device/testing/linux-samsung-j4primelte/APKBUILD"

          # Fix 1: makedepends'e dtbtool ekle
          if ! grep -q "dtbtool" "$LINUX_APKBUILD"; then
            sed -i '/^makedepends=/s/"$/ dtbtool"/' "$LINUX_APKBUILD"
            echo "✅ dtbtool makedepends'e eklendi"
          fi

          # Fix 2 + 3: State machine ile build() ve package() fonksiyonlarını bul
          # Regex yerine satır satır okuma — çok daha güvenilir
          LINUX_APKBUILD="$LINUX_APKBUILD" python3 << 'PYEOF'
          import os

          path = os.environ['LINUX_APKBUILD']

          with open(path, 'r') as f:
              lines = f.readlines()

          new_lines = []
          in_build = False
          in_package = False
          brace_depth = 0
          dtbtool_added = False
          dtimg_added = False

          # Zaten patch uygulandıysa atla
          content = ''.join(lines)
          already_dtbtool = 'dtbTool' in content
          already_dtimg = 'dt.img' in content

          if already_dtbtool and already_dtimg:
              print("ℹ️  Zaten patch uygulanmış, atlanıyor")
              exit(0)

          for i, line in enumerate(lines):
              stripped = line.strip()

              # Fonksiyon başlangıcını tespit et
              if stripped.startswith('build()'):
                  in_build = True
                  in_package = False
                  brace_depth = 0
              elif stripped.startswith('package()'):
                  in_package = True
                  in_build = False
                  brace_depth = 0

              # Brace derinliğini takip et
              if in_build or in_package:
                  brace_depth += stripped.count('{') - stripped.count('}')

                  # Fonksiyon kapanıyor mu?
                  if brace_depth <= 0 and '{' in ''.join(lines[max(0,i-5):i+1]):
                      if in_build and not already_dtbtool and not dtbtool_added:
                          # build() kapanmadan önce dtbTool ekle
                          new_lines.append('\t# QCDT: Qualcomm Concatenated Device Tree\n')
                          new_lines.append('\tdtbTool -s 2048 \\\n')
                          new_lines.append('\t\t-o "$builddir/arch/arm64/boot/dt.img" \\\n')
                          new_lines.append('\t\t"$builddir/arch/arm64/boot/dts/qcom/" \\\n')
                          new_lines.append('\t\t|| { echo "dtbTool failed or no DTBs found"; ls "$builddir/arch/arm64/boot/dts/qcom/" 2>/dev/null || true; }\n')
                          dtbtool_added = True
                          print("✅ dtbTool build() fonksiyonuna eklendi")
                          in_build = False

                      elif in_package and not already_dtimg and not dtimg_added:
                          # package() kapanmadan önce dt.img install ekle
                          new_lines.append('\t# Install QCDT image\n')
                          new_lines.append('\t[ -f "$builddir/arch/arm64/boot/dt.img" ] && \\\n')
                          new_lines.append('\t\tinstall -Dm644 "$builddir/arch/arm64/boot/dt.img" \\\n')
                          new_lines.append('\t\t"$pkgdir/boot/dt.img" || \\\n')
                          new_lines.append('\t\techo "Warning: dt.img not found, skipping"\n')
                          dtimg_added = True
                          print("✅ dt.img install package() fonksiyonuna eklendi")
                          in_package = False

              new_lines.append(line)

          with open(path, 'w') as f:
              f.writelines(new_lines)

          if not dtbtool_added and not already_dtbtool:
              print("::warning::dtbTool eklenemedi - build() fonksiyonu bulunamadı")
          if not dtimg_added and not already_dtimg:
              print("::warning::dt.img install eklenemedi - package() fonksiyonu bulunamadı")
          PYEOF

          echo "▶ Güncel APKBUILD (ilgili satırlar):"
          grep -n -E "dtbtool|dtbTool|dt\.img|makedepends" "$LINUX_APKBUILD" || true

          echo ""
          echo "▶ build() fonksiyonu:"
          awk '/^build\(\)/,/^\}/' "$LINUX_APKBUILD" | tail -20 || true

      - name: Write config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config"
          EXTRA="${EXTRA_PACKAGES:-none}"
          [ -z "$EXTRA" ] && EXTRA="none"

          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF
          [pmbootstrap]
          aports = ${PMB_APORTS}
          build_default_device_arch = True
          build_pkgs_on_install = True
          ccache_size = 5G
          device = ${DEVICE}
          extra_packages = ${EXTRA}
          hostname = j4primelte
          jobs = $(nproc)
          kernel = downstream
          locale = en_US.UTF-8
          ssh_keys = False
          ssh_key_glob = ~/.ssh/id_*.pub
          sudo_timer = False
          timezone = Europe/Istanbul
          ui = ${UI}
          ui_extras = False
          user = pmos
          work = ${PMB_WORK}
          EOF

      - name: pmbootstrap init
        shell: bash
        run: |
          set +o pipefail
          yes "" | pmbootstrap -y init
          PMB_EXIT="${PIPESTATUS[1]}"
          set -euo pipefail
          if [ "$PMB_EXIT" -ne 0 ] && [ "$PMB_EXIT" -ne 141 ]; then exit "$PMB_EXIT"; fi

          pmbootstrap config device                    "$DEVICE"
          pmbootstrap config ui                        "$UI"
          pmbootstrap config kernel                    "downstream"
          pmbootstrap config build_default_device_arch "True"
          pmbootstrap config build_pkgs_on_install     "True"
          EXTRA="${EXTRA_PACKAGES:-none}"
          [ -z "$EXTRA" ] && EXTRA="none"
          pmbootstrap config extra_packages "$EXTRA"

      - name: Regenerate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$PMB_APORTS/device/testing/device-samsung-j4primelte"
          pmbootstrap checksum device-samsung-j4primelte
          echo "✅ device checksum güncellendi"

          cd "$PMB_APORTS/device/testing/linux-samsung-j4primelte"
          pmbootstrap checksum linux-samsung-j4primelte
          echo "✅ linux checksum güncellendi"

      - name: Verify APKBUILDs
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_PKG=$(find "$PMB_APORTS" -path "*/device-${DEVICE}/APKBUILD" -print -quit 2>/dev/null || true)
          KERNEL_PKG=$(find "$PMB_APORTS" -path "*/linux-${DEVICE}/APKBUILD" -print -quit 2>/dev/null || true)
          if [ -z "$DEVICE_PKG" ]; then echo "::error::device APKBUILD yok!"; exit 1; fi
          if [ -z "$KERNEL_PKG" ]; then echo "::error::kernel APKBUILD yok!"; exit 1; fi

      - name: Build image
        shell: bash
        env:
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
        run: |
          set -euo pipefail
          PASSWORD="${PMOS_PASSWORD:-147147}"
          printf '%s\n%s\n' "$PASSWORD" "$PASSWORD" | pmbootstrap install --no-fde

      - name: Upload pmbootstrap log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "pmbootstrap-log-run${{ github.run_number }}"
          path: ${{ env.PMB_WORK }}/log.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          pmbootstrap export "$EXPORT_DIR"
          ls -lah "$EXPORT_DIR"/

      - name: Export Odin
        shell: bash
        run: |
          pmbootstrap export --odin "$EXPORT_DIR" || echo "Odin export başarısız"

      - name: Compress
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference \
            -cJf /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz \
            -C "$EXPORT_DIR" \
            .
          echo "▶ Sonuç:"
          ls -lah /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "pmos-${{ env.DEVICE }}-${{ env.UI }}-run${{ github.run_number }}"
          path: /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz
          retention-days: 14
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pmos-${{ env.DEVICE }}-${{ env.UI }}.tar.xz
          generate_release_notes: true
          body: |
            ## postmarketOS – j4primelte
            | | |
            |---|---|
            | **UI** | `${{ env.UI }}` |
            | **Channel** | `${{ env.CHANNEL }}` |
            | **Commit** | `${{ github.sha }}` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pmbootstrap -y zap 2>/dev/null || true
          sudo rm -rf "${PMB_WORK}/chroot_"* 2>/dev/null || true
