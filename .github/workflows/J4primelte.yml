name: Build lk2nd (j4primelte)

# Builds lk2nd for the Samsung Galaxy J4+ (SM-J415F, codename j4primelte,
# SoC MSM8917). Produces lk2nd-msm8952-j4primelte.img as a build artifact,
# and attaches it to a GitHub Release when you push a tag like v0.1.
#
# Put this file at: .github/workflows/build-lk2nd.yml
# Then push. The image appears under Actions -> the run -> Artifacts.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      lk2nd_ref:
        description: 'lk2nd git ref to build (branch / tag / commit SHA)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build lk2nd-msm8952
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-arm-none-eabi \
            device-tree-compiler \
            bc \
            python3

      - name: Clone lk2nd
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.lk2nd_ref || 'main' }}"
          echo "Building lk2nd ref: $REF"
          echo "LK2ND_REF=$REF" >> "$GITHUB_ENV"
          if ! git clone --depth 1 --branch "$REF" \
               https://github.com/msm8916-mainline/lk2nd.git; then
            echo "Ref '$REF' is not a branch/tag, trying as commit SHA..."
            git clone https://github.com/msm8916-mainline/lk2nd.git
            cd lk2nd
            git fetch --depth 1 origin "$REF" || true
            git checkout FETCH_HEAD
          fi
          cd lk2nd
          echo "lk2nd commit: $(git rev-parse HEAD)"
          echo "LK2ND_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Add j4primelte device tree
        working-directory: lk2nd
        run: |
          set -euo pipefail
          DTS="lk2nd/device/dts/msm8952/msm8917-samsung-j4primelte.dts"
          cat > "$DTS" <<'EOF'
          // SPDX-License-Identifier: BSD-3-Clause
          // lk2nd device tree for Samsung Galaxy J4+ (SM-J415F) / j4primelte.
          // SoC: Qualcomm MSM8917 (Snapdragon 425).
          //
          // Values extracted from running LineageOS 18.1 on SM-J415F:
          //   qcom,msm-id   = <303 0>,<308 0>,<309 0>
          //   bootloader    = J415FXXU6BVJ1  -> match "J415F*"
          // board-id MUST be <8 0> not <8 6>: Samsung SBL masks the revision
          // byte and crashes with a register dump if board-id is <8 6>.

          /dts-v1/;

          #include <skeleton64.dtsi>
          #include <lk2nd.dtsi>

          / {
              qcom,msm-id = <QCOM_ID_MSM8917 0>, <308 0>, <309 0>;
              qcom,board-id = <QCOM_BOARD_ID_MTP 0>;
              __symbols__ {};
          };

          &lk2nd {
              model = "Samsung Galaxy J4+ (SM-J415F)";
              compatible = "samsung,j4primelte", "samsung,j4prime";
              lk2nd,match-bootloader = "J415F*";
              // No lk2nd,dtb-files yet: no upstream j4primelte DTB exists.
              // The generic msm89x7 kernel uses its own appended DTB set.
          };
          EOF
          echo "Wrote $DTS"
          sed -n '1,60p' "$DTS"

      - name: Register DTB in rules.mk
        working-directory: lk2nd
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "lk2nd/device/dts/msm8952/rules.mk"
          s = open(p).read()
          anchor = "\t$(LOCAL_DIR)/msm8917-mtp.dtb \\\n"
          addition = "\t$(LOCAL_DIR)/msm8917-samsung-j4primelte.dtb \\\n"
          assert anchor in s, "Could not find ADTBS anchor in rules.mk"
          assert addition not in s, "j4primelte already registered"
          open(p, "w").write(s.replace(anchor, anchor + addition, 1))
          print(open(p).read())
          PY

      - name: Build lk2nd-msm8952
        working-directory: lk2nd
        run: |
          set -euo pipefail
          # IMPORTANT: MSM8917 uses the msm8952 target, NOT msm8916.
          make -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8952
          test -f build-lk2nd-msm8952/lk2nd.img
          ls -la build-lk2nd-msm8952/lk2nd.img

      - name: Verify j4primelte is embedded in the image
        working-directory: lk2nd
        run: |
          set -euo pipefail
          if strings build-lk2nd-msm8952/lk2nd.img | grep -q "Samsung Galaxy J4+"; then
            echo "OK: j4primelte DTB found in lk2nd.img"
          else
            echo "ERROR: j4primelte DTB not found in image" >&2
            exit 1
          fi

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp lk2nd/build-lk2nd-msm8952/lk2nd.img out/lk2nd-msm8952-j4primelte.img
          cd out
          sha256sum lk2nd-msm8952-j4primelte.img > lk2nd-msm8952-j4primelte.img.sha256
          {
            echo "lk2nd build for Samsung Galaxy J4+ (SM-J415F) / j4primelte"
            echo "========================================================="
            echo "Built:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "lk2nd ref:  ${LK2ND_REF}"
            echo "lk2nd SHA:  ${LK2ND_SHA}"
            echo "Target:     lk2nd-msm8952 (MSM8917)"
            echo "Match:      bootloader J415F*"
            echo
            echo "Flash (first time, from Samsung Download mode):"
            echo "  heimdall flash --BOOT lk2nd-msm8952-j4primelte.img"
            echo
            echo "Then enter lk2nd fastboot (hold Volume Down after the lk2nd"
            echo "screen appears) and verify: fastboot oem cmdline"
          } | tee BUILD_INFO.txt
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-j4primelte
          path: out/
          retention-days: 90
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/lk2nd-msm8952-j4primelte.img
            out/lk2nd-msm8952-j4primelte.img.sha256
            out/BUILD_INFO.txt
          generate_release_notes: true
